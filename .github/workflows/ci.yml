name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check all targets
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Lint all targets
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test all features
        run: cargo test --locked --workspace --all-features

  native-shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked native shell scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' scripts < <(git ls-files -z -- 'native/*.sh')
          if (( ${#scripts[@]} == 0 )); then
            echo 'No tracked native shell scripts found.' >&2
            exit 1
          fi
          bash -n "${scripts[@]}"
