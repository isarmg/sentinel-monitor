# Optional Linux/public-network overlay:
# docker compose -f docker-compose.yml -f docker-compose.turn.yml up -d --build
services:
  mediamtx:
    environment:
      MTX_WEBRTCICESERVERS2_0_URL: turn:${TURN_PUBLIC_HOST:?set TURN_PUBLIC_HOST}:3478?transport=tcp
      MTX_WEBRTCICESERVERS2_0_USERNAME: AUTH_SECRET
      MTX_WEBRTCICESERVERS2_0_PASSWORD: ${TURN_SECRET:?set TURN_SECRET}
      MTX_WEBRTCICESERVERS2_0_CLIENTONLY: "true"

  coturn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    command:
      - --no-cli
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${TURN_REALM:-monitor.local}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200

