logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://127.0.0.1:8080/internal/media/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: yes
apiAddress: 127.0.0.1:9997
metrics: yes
metricsAddress: 127.0.0.1:9998
playback: yes
playbackAddress: 127.0.0.1:9996

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsAlwaysRemux: no

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189

pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 15s
  recordFormat: fmp4
  # start.sh supplies the absolute state path through
  # MTX_PATHDEFAULTS_RECORDPATH; this inert default never points at a checkout.
  recordPath: /var/lib/isarmg/sentinel-monitor/recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordPartDuration: 1s
  recordMaxPartSize: 100M
  recordSegmentDuration: 15m
  recordDeleteAfter: 168h

paths: {}
