<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>哨界 · 摄像头监控</title>
  </head>
  <body data-sarmg-scope>
    <section id="login-screen" class="login-screen">
      <div class="login-atmosphere" aria-hidden="true">
        <div class="radar-ring ring-one"></div>
        <div class="radar-ring ring-two"></div>
        <div class="radar-sweep"></div>
      </div>
      <form id="login-form" class="login-card">
        <p class="eyebrow">SENTINEL / RUST</p>
        <h1>哨界</h1>
        <p class="login-copy">把分散的现场，收拢到一个清醒的视野。</p>
        <label>邮箱<input name="email" type="email" autocomplete="username" required /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
        <button class="button button-primary" type="submit">进入控制台</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>

    <div id="app" class="app-shell" hidden>
      <aside class="side-rail">
        <a class="brand" href="#" aria-label="哨界首页"><span class="brand-mark"></span><span>哨界</span></a>
        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item active" data-view="cameras"><span>01</span>实时监控</button>
          <button class="nav-item" data-view="recordings"><span>02</span>录像检索</button>
          <button class="nav-item" data-view="events"><span>03</span>事件中心</button>
          <button class="nav-item" data-view="system"><span>04</span>系统管理</button>
        </nav>
        <div class="rail-footer">
          <div class="operator-card"><small>当前值守</small><strong id="operator-email"></strong><span id="operator-role"></span></div>
          <button id="logout-button" class="text-button">退出登录</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div><p class="eyebrow" id="view-kicker">LIVE OPERATIONS</p><h2 id="view-title">实时监控</h2></div>
          <div class="topbar-status"><span id="online-summary" class="status-chip">连接中</span><time id="clock"></time></div>
        </header>

        <section class="view active" data-view-panel="cameras">
          <div class="command-bar">
            <div class="search-wrap"><span>⌕</span><input id="camera-search" type="search" placeholder="搜索名称或位置" /></div>
            <div class="command-actions">
              <button id="discover-button" class="button button-quiet operator-only">发现ONVIF设备</button>
              <button id="add-camera-button" class="button button-primary admin-only">添加摄像头</button>
            </div>
          </div>
          <div id="camera-grid" class="camera-grid"></div>
          <div class="pager"><button id="page-prev" class="text-button">上一页</button><span id="page-label"></span><button id="page-next" class="text-button">下一页</button></div>
        </section>

        <section class="view" data-view-panel="recordings">
          <div class="filter-panel">
            <label>摄像头<select id="record-camera"></select></label>
            <label>开始时间<input id="record-start" type="datetime-local" /></label>
            <label>结束时间<input id="record-end" type="datetime-local" /></label>
            <button id="record-search" class="button button-primary">查询录像</button>
          </div>
          <div class="recording-layout">
            <div><div class="section-heading"><h3>录像时间段</h3><span id="record-count">0 条</span></div><div id="record-list" class="record-list empty-state">选择摄像头和时间范围开始查询</div></div>
            <div class="playback-stage"><video id="playback-video" controls playsinline></video><div id="playback-caption">尚未选择录像</div></div>
          </div>
        </section>

        <section class="view" data-view-panel="events">
          <div class="command-bar"><label class="toggle-line"><input id="unacked-only" type="checkbox" />仅显示未确认事件</label><button id="refresh-events" class="button button-quiet">刷新</button></div>
          <div class="table-frame"><table><thead><tr><th>等级</th><th>事件</th><th>摄像头</th><th>时间</th><th>状态</th></tr></thead><tbody id="event-table"></tbody></table></div>
        </section>

        <section class="view" data-view-panel="system">
          <div id="system-cards" class="system-cards"></div>
          <section class="management-block admin-only"><div class="section-heading"><h3>账号与角色</h3><button id="add-user-button" class="button button-primary">添加账号</button></div><div class="table-frame"><table><thead><tr><th>邮箱</th><th>角色</th><th>状态</th><th>最近登录</th><th></th></tr></thead><tbody id="user-table"></tbody></table></div></section>
          <section class="management-block admin-only"><div class="section-heading"><h3>最近审计记录</h3><button id="refresh-audit" class="text-button">刷新</button></div><div id="audit-list" class="audit-list"></div></section>
        </section>
      </main>
    </div>

    <dialog id="camera-dialog" class="modal">
      <form id="camera-form" method="dialog">
        <div class="modal-heading"><div><p class="eyebrow">DEVICE CONFIG</p><h3 id="camera-dialog-title">添加摄像头</h3></div><button type="button" class="icon-button modal-close" aria-label="关闭">×</button></div>
        <input type="hidden" name="id" />
        <div class="form-grid">
          <label>名称<input name="name" required maxlength="100" /></label>
          <label>位置<input name="location" maxlength="160" /></label>
          <label class="wide">主码流 RTSP<input name="main_stream_url" placeholder="rtsp://192.168.1.20/stream/main" /></label>
          <label class="wide">子码流 RTSP<input name="sub_stream_url" placeholder="rtsp://192.168.1.20/stream/sub" /></label>
          <label class="wide">ONVIF设备服务地址<input name="onvif_url" placeholder="http://192.168.1.20/onvif/device_service" /></label>
          <label>设备用户名<input name="username" autocomplete="off" /></label>
          <label>设备密码<input name="password" type="password" autocomplete="new-password" /></label>
        </div>
        <p id="secret-help" class="field-help">设备凭据会在服务端加密保存，不会返回浏览器。</p>
        <div class="check-row"><label><input name="enabled" type="checkbox" checked />启用设备</label><label><input name="record_enabled" type="checkbox" checked />录制主码流</label></div>
        <div class="modal-actions"><button type="button" class="button button-quiet modal-close">取消</button><button type="submit" class="button button-primary">保存设备</button></div>
      </form>
    </dialog>

    <dialog id="user-dialog" class="modal modal-small">
      <form id="user-form" method="dialog">
        <div class="modal-heading"><div><p class="eyebrow">ACCESS CONTROL</p><h3 id="user-dialog-title">添加账号</h3></div><button type="button" class="icon-button modal-close" aria-label="关闭">×</button></div>
        <input type="hidden" name="id" />
        <label>邮箱<input name="email" type="email" required /></label>
        <label>角色<select name="role"><option value="viewer">只读观察员</option><option value="operator">值守操作员</option><option value="admin">系统管理员</option></select></label>
        <label>密码<input name="password" type="password" minlength="12" /></label>
        <label class="toggle-line"><input name="active" type="checkbox" checked />账号可用</label>
        <div class="modal-actions"><button type="button" class="button button-quiet modal-close">取消</button><button type="submit" class="button button-primary">保存账号</button></div>
      </form>
    </dialog>

    <aside id="camera-drawer" class="camera-drawer" aria-hidden="true">
      <div class="drawer-header"><div><p class="eyebrow">PRIMARY STREAM</p><h3 id="drawer-camera-name"></h3><span id="drawer-camera-location"></span></div><button id="drawer-close" class="icon-button" aria-label="关闭">×</button></div>
      <div class="detail-video"><video id="detail-video" muted autoplay playsinline controls></video><div id="detail-video-state" class="video-state">正在建立实时连接</div></div>
      <div class="ptz-panel operator-only"><div><p class="eyebrow">ONVIF PTZ</p><h4>云台控制</h4></div><div class="ptz-grid"><span></span><button data-ptz="0,0.55,0">↑</button><span></span><button data-ptz="-0.55,0,0">←</button><button data-ptz="stop">■</button><button data-ptz="0.55,0,0">→</button><span></span><button data-ptz="0,-0.55,0">↓</button><span></span></div><div class="zoom-row"><button data-ptz="0,0,-0.45">− 拉远</button><button data-ptz="0,0,0.45">＋ 拉近</button></div></div>
    </aside>
    <div id="drawer-scrim" class="drawer-scrim"></div>
    <div id="toast-stack" class="toast-stack" aria-live="polite"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
