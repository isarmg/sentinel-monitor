logLevel: info
logDestinations: [stdout]

authMethod: http
authHTTPAddress: http://app:8080/internal/media/auth
authHTTPExclude:
  - action: api
  - action: metrics
  - action: pprof

api: yes
apiAddress: :9997
metrics: yes
metricsAddress: :9998
playback: yes
playbackAddress: :9996

rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency
hlsAlwaysRemux: no

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189

pathDefaults:
  sourceOnDemand: yes
  sourceOnDemandStartTimeout: 15s
  sourceOnDemandCloseAfter: 15s
  recordFormat: fmp4
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f
  recordPartDuration: 1s
  recordMaxPartSize: 100M
  recordSegmentDuration: 15m
  recordDeleteAfter: 168h

paths: {}

